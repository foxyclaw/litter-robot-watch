# Watchdog Services — multi-function monitoring config
# Add new checks under "checks:" with their own interval_seconds.

# Global Telegram bot (used as fallback; checks can override with their own bot)
telegram:
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
  chat_id: "YOUR_TELEGRAM_CHAT_ID"
  # Telegram user IDs whose direct messages to the bot are also answered
  # (replies go to the chat the command came from). Empty = group chat only.
  authorized_user_ids: []
  # Telegram user IDs that ALSO get critical alerts as a direct message, in
  # addition to the group: litter dumped, globe motor / retract fault, pinch,
  # hardware error status, offline — first alert, every reminder and the ✅
  # resolved message. Not used for routine alerts (waste drawer, low litter).
  # Each user must open the bot and press Start once, or Telegram answers 403.
  alert_dm_user_ids: []

# Logging
logging:
  log_file: "/path/to/litter-robot-watch/litter_monitor.log"
  log_level: "INFO"

# ── Checks ────────────────────────────────────────────────────────────────────
checks:

  # ── Litter Robot / Whisker ──────────────────────────────────────────────────
  - name: litter_robot
    enabled: true
    interval_seconds: 300
    config:
      whisker:
        email: "you@example.com"
        password: "YOUR_WHISKER_PASSWORD"
      database: "/path/to/litter-robot-watch/litter_robot.db"
      # telegram: omitted → falls back to global bot above
      # Local time zone for all displayed times (correct PST/PDT handling)
      timezone: "America/Los_Angeles"
      # Forensic logging: full raw snapshot every poll -> SQLite (raw_snapshots)
      # + daily JSONL files; activity feed copied to SQLite (activity_history)
      forensics:
        jsonl_dir: "data"               # relative to the project dir, gitignored
        retention_days: 90              # raw snapshots (DB + JSONL) older than this are deleted
        activity_interval_seconds: 300  # how often to copy the Whisker activity feed
      # Capture transient states
      realtime:
        websocket: true                 # Whisker push updates; polling continues regardless
        fast_poll_interval_seconds: 30  # poll this fast while a cycle / fault is in progress
        fast_poll_hold_seconds: 300     # ... and for this long afterwards
      alerts:
        waste_levels:
          - "DF1"
          - "DF2"
          - "DFS"
          - "DRAWER_FULL"
        waste_threshold: 90
        waste_repeat_seconds: 10800  # repeat waste alert at most every 3h
        # ── Litter-dump detection ("all the litter ended up in the drawer") ──
        dump_waste_jump_points: 25      # waste % steps up by >= this ...
        dump_window_seconds: 900        # ... within this window (15 min)
        dump_confirm_seconds: 300       # ... and stays there this long (0 = alert at once)
        dump_litter_drop_points: 25     # or litter level % steps down by >= this
        dump_max_gap_seconds: 21600     # don't compare readings further apart than this
        dump_ignore_zero_baseline: true # 0% right after emptying the drawer is not a baseline
        dump_repeat_seconds: 3600       # remind every hour until resolved or /ack
        dump_max_alert_seconds: 86400   # stop reminding after a day
        # ── Litter level state ──
        litter_low_states: ["LOW", "REFILL", "EMPTY"]
        litter_low_repeat_seconds: 86400
        # ── Faults (globe motor, retract, pinch, USB, error statuses, offline) ──
        fault_repeat_seconds: 3600      # remind every hour until resolved or /ack
        offline_minutes: 30             # robot offline / Whisker cloud unreachable for this long
        status_grace_seconds: 600       # bonnet removed / paused / off must persist this long
        error_statuses:
          - "CSF"
          - "BR"
          - "CSI"
          - "P"
          - "OFF"

  # ── Stock Price Alerts (Alpaca API, no LLM) ─────────────────────────────────
  - name: stock_price
    enabled: true
    interval_seconds: 300  # каждые 5 минут
    config:
      alpaca_key: "YOUR_ALPACA_KEY"
      alpaca_secret: "YOUR_ALPACA_SECRET"
      state_file: "/path/to/litter-robot-watch/stock_price_state.json"

      telegram:
        bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
        chat_id: "YOUR_TELEGRAM_CHAT_ID"
      # Watches: list of symbols + thresholds
      watches:
        - symbol: "GOOG"
          threshold: 398
          direction: "above"   # alert when price >= threshold
